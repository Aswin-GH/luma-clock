<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Luma Clock">
  <meta name="description" content="A bright, distraction-free clock that works offline.">
  <title>Luma Clock</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <style>
    html, body, .clock-app, .mode-toggle { -webkit-tap-highlight-color: transparent; }
    .digital-clock { row-gap: clamp(14px, 4vh, 44px); }
    .digital-clock span:first-child, .hour-hand { color: var(--hour-color, currentColor); }
    .digital-clock span:last-child, .minute-hand { color: var(--minute-color, currentColor); }
    .analog-clock { border: 0; box-shadow: none; }
    .analog-clock .marker { width: clamp(10px, 2vmin, 20px); height: clamp(10px, 2vmin, 20px); border-radius: 50%; }
    .analog-clock .marker-12, .analog-clock .marker-6 { left: 50%; transform: translateX(-50%); }
    .analog-clock .marker-3, .analog-clock .marker-9 { top: 50%; transform: translateY(-50%); }
    .analog-clock .hand { clip-path: polygon(36% 0, 64% 0, 100% 100%, 0 100%); border-radius: 45% 45% 28% 28%; }
    .analog-clock .hour-hand { width: clamp(20px, 3.8vmin, 44px); }
    .analog-clock .minute-hand { width: clamp(13px, 2.4vmin, 29px); }
  </style>
</head>
<body>
  <main class="clock-app" aria-label="Clock">
    <div class="clock-stage" aria-live="polite">
      <div class="digital-clock"><span id="hours">00</span><span id="minutes">00</span></div>
      <div class="analog-clock" hidden aria-hidden="true">
        <div class="marker marker-12"></div><div class="marker marker-3"></div><div class="marker marker-6"></div><div class="marker marker-9"></div>
        <div class="hand hour-hand"></div><div class="hand minute-hand"></div><div class="pin"></div>
      </div>
    </div>
    <button class="mode-toggle" type="button" aria-label="Switch to analog clock"><span class="analog-icon"><i></i><i></i></span></button>
    <p class="gesture-hint">tap · color&nbsp;&nbsp; swipe · brightness&nbsp;&nbsp; pinch · size</p>
  </main>
  <script src="./app.js?v=9"></script>
</body>
</html>
